<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetaria · Lazarus-5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#3DDC84;--blue:#2E8BFF;--blue-rgb:46,139,255;--tx:#fff;--mu:rgba(255,255,255,.64);--dim:rgba(255,255,255,.4);--line:rgba(255,255,255,.13);
 --sans:Inter,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--ease:cubic-bezier(.16,1,.3,1);--side:356px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--tx);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--blue);outline-offset:4px}
h2{font:500 .68rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}

main{position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease,filter .9s ease}
body.site main{filter:brightness(.42)}
body.lit main{opacity:1}
.globe{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.globe.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.panel{position:fixed;top:0;bottom:0;width:var(--side);z-index:5;display:flex;flex-direction:column;opacity:0;transition:transform 2s var(--ease) .5s,opacity 1.5s ease .6s;will-change:transform}
#left{left:0;transform:translate3d(-104%,0,0);background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.42) 68%,transparent)}
#right{right:0;transform:translate3d(104%,0,0);background:linear-gradient(270deg,rgba(0,0,0,.78),rgba(0,0,0,.42) 68%,transparent)}
body.ready #left,body.ready #right{transform:none;opacity:1}
.center{position:fixed;top:0;bottom:0;left:var(--side);right:var(--side);z-index:4;pointer-events:none;opacity:0;transition:opacity 1.1s ease 2.2s}
body.ready .center{opacity:1}.center>*{pointer-events:auto}
#loader{position:fixed;left:0;right:0;top:calc(50% + 120px);text-align:center;z-index:3;font:300 .78rem/1 var(--sans);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--mu);opacity:0;transition:opacity .9s ease;pointer-events:none}
body.lit #loader{opacity:1}body.ready #loader{opacity:0;transition-duration:.5s}

.brand{display:flex;align-items:center;gap:12px;padding:26px 30px 22px}
.brand img{height:34px;width:auto;display:block}
.brand span{font:500 1.18rem/1 var(--sans);letter-spacing:.3em;text-transform:uppercase}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 30px 30px}
.pick{display:flex;gap:30px;margin:16px 0 38px}
.pick button{font:300 1.7rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-bottom:9px;border-bottom:1px solid transparent;transition:color .35s,text-shadow .35s,border-color .35s}
.pick button:hover{color:var(--mu)}
.pick button[aria-pressed=true]{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55);border-color:var(--blue)}
details{border-top:1px solid var(--line)}details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:15px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;transition:color .25s}
summary::-webkit-details-marker{display:none}
summary b{font-weight:400;font-size:1rem;letter-spacing:.02em;color:var(--mu);transition:color .25s}
details[open] summary b,summary:hover b{color:#fff}
summary output{font:400 .76rem var(--mono);color:var(--dim)}details[open] summary output{color:var(--blue)}
.cat{padding:0 0 20px}
.f{margin-bottom:16px}.f>div{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--mu)}.f output{font:400 .76rem var(--mono);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim)}
#apply{display:block;width:100%;margin-top:26px;padding:13px 0;font:500 .76rem/1 var(--sans);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#fff;border:1px solid var(--blue);box-shadow:0 0 18px rgba(var(--blue-rgb),.45),inset 0 0 14px rgba(var(--blue-rgb),.18);transition:all .35s}
#apply:hover{background:var(--blue);box-shadow:0 0 26px rgba(var(--blue-rgb),.8)}
#apply:disabled{color:var(--dim);border-color:var(--line);box-shadow:none;background:none;cursor:default}
.ck{display:flex;gap:11px;align-items:center;margin-top:10px;font-size:.84rem;color:var(--mu);cursor:pointer;transition:color .2s}.ck:hover{color:#fff}
.ck input{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;border:1px solid var(--dim);border-radius:50%;flex-shrink:0;transition:all .2s;cursor:pointer}
.ck input:checked{background:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(var(--blue-rgb),.8)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:6px 0 2px;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-track{height:1px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:11px;width:11px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(var(--blue-rgb),.55),0 0 14px rgba(var(--blue-rgb),.9);transition:transform .2s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]::-moz-range-thumb{height:11px;width:11px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(var(--blue-rgb),.55)}

.views{position:absolute;top:30px;left:0;right:0;display:flex;justify-content:center;gap:38px;pointer-events:none}
.views button{pointer-events:auto;font:400 .82rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);transition:color .35s,text-shadow .35s;white-space:nowrap}
.views button:hover{color:rgba(255,255,255,.8)}
.views button[aria-pressed=true]{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.75),0 0 2px rgba(255,255,255,.6)}
#zone{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:.84rem;line-height:1.7;color:var(--mu);text-shadow:0 1px 8px #000;pointer-events:none}
#zone b{color:#fff;font-weight:500}#zone span{font-family:var(--mono);font-size:.76rem}
#legend{position:absolute;left:14px;bottom:30px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:none}
#legend i{display:block;width:120px;height:2px;margin:7px 0 6px}#legend div{display:flex;justify-content:space-between}
#back{position:absolute;right:14px;bottom:30px;font:400 .72rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:9px 0 9px 22px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s,text-shadow .3s}
#back.show{opacity:1;visibility:visible;transition:opacity .5s,text-shadow .3s}#back:hover{text-shadow:0 0 14px rgba(255,255,255,.8)}
#back::before{content:"";position:absolute;left:0;top:50%;width:14px;height:1px;background:var(--blue);box-shadow:0 0 8px var(--blue)}
/* Close view of one site */
#site{position:absolute;left:50%;top:50%;width:min(88%,620px);transform:translate(-50%,-50%) scale(.82);opacity:0;visibility:hidden;transition:opacity .7s ease,transform .9s var(--ease),visibility 0s .9s}
#site.show{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:opacity .7s ease,transform .9s var(--ease)}
#site figure{margin:0;position:relative;aspect-ratio:16/10;overflow:hidden;box-shadow:0 0 0 1px rgba(var(--blue-rgb),.7),0 0 60px rgba(var(--blue-rgb),.28)}
#site canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#site .box{position:absolute;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 16px rgba(var(--blue-rgb),1)}
#site .box::before,#site .box::after{content:"";position:absolute;background:rgba(255,255,255,.55)}
#site .box::before{left:50%;top:-900px;bottom:-900px;width:1px;opacity:.5}
#site .box::after{top:50%;left:-900px;right:-900px;height:1px;opacity:.5}
#site .cap{display:flex;justify-content:space-between;gap:16px;font:400 .7rem var(--mono);color:var(--mu);margin:9px 0;text-shadow:0 1px 6px #000}#site .cap b{color:#fff;font-weight:500}
.pin{width:22px;height:22px;margin:-11px 0 0 -11px;border:1px solid #fff;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font:500 10px/20px var(--mono);text-align:center;cursor:pointer;pointer-events:auto;box-shadow:0 0 12px rgba(var(--blue-rgb),.9);transition:transform .25s,background .25s,color .25s}
.pin:hover{transform:scale(1.25)}.pin.on{background:#fff;color:#000;box-shadow:0 0 0 3px rgba(var(--blue-rgb),.6),0 0 22px rgba(var(--blue-rgb),1)}

#right{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
#right section{display:flex;flex-direction:column;min-height:0}
#right section+section{border-top:1px solid var(--line)}
#right h2{padding:30px 30px 16px}#right section+section h2{padding-top:22px}
#right .scroll{padding:0 30px 20px}
.hit{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);transition:padding .35s var(--ease)}
.hit:first-child{border-top:0}
.hit em{font:400 .72rem var(--mono);color:var(--dim);font-style:normal}
.hit strong{display:block;font-weight:400;font-size:.98rem;color:var(--mu);transition:color .25s}
.hit small{font:400 .68rem var(--mono);color:var(--dim)}
.hit span{font:400 .9rem var(--mono);color:var(--mu)}
.hit:hover strong{color:#fff}
.hit.on{padding-left:10px;box-shadow:inset 1px 0 0 var(--blue)}.hit.on strong{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.45)}.hit.on em,.hit.on span{color:var(--blue)}
.hit.hi strong,.hit.hi span,.hit.hi.on span{color:var(--green)}.hit.hi.on strong{text-shadow:0 0 14px rgba(61,220,132,.45)}
.rep{animation:rise .5s var(--ease)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rep h3{font:400 1.3rem/1.2 var(--sans);margin:0 0 4px}.rep .sub{font:400 .68rem/1.6 var(--mono);color:var(--dim)}
.score{display:flex;align-items:baseline;gap:12px;margin:16px 0 14px}.score b{font:700 2.8rem/1 var(--sans);letter-spacing:-.02em}.score b i{font-style:normal;font-size:1.1rem;color:var(--blue);margin-left:2px}.score span{color:#fff;font-size:1.08rem;font-weight:400;line-height:1.3}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.sec h2{padding:0!important;margin-bottom:12px}
.bar{display:grid;grid-template-columns:128px 1fr 26px;gap:10px;align-items:center;font-size:.78rem;color:var(--dim);margin:3px 0}
.bar.top{color:#fff;margin-top:11px}.bar i{display:block;height:1px;background:rgba(255,255,255,.16);position:relative}
.bar i u{position:absolute;left:0;top:-1px;height:3px;background:rgba(255,255,255,.5);transition:width .6s var(--ease)}
.bar.top i u{background:var(--blue);box-shadow:0 0 8px rgba(var(--blue-rgb),.9)}.bar span{font:400 .7rem var(--mono);text-align:right}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{font:500 .6rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:right;padding:0 0 7px}th:first-child{text-align:left}
td{padding:5px 0;color:var(--mu);border-top:1px solid rgba(255,255,255,.07)}td+td{text-align:right;color:#fff;font:400 .74rem var(--mono)}td.d{color:var(--dim)}td.t{color:var(--blue)}
.note{font-size:.84rem;color:var(--mu);line-height:1.6;margin:0}.note b{color:#fff;font-weight:500}
.link{font:400 .72rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#fff;margin-top:14px;padding:8px 0 8px 22px;position:relative;transition:text-shadow .3s}
.link::before{content:"";position:absolute;left:0;top:50%;width:14px;height:1px;background:var(--blue);box-shadow:0 0 8px var(--blue)}.link:hover{text-shadow:0 0 14px rgba(255,255,255,.8)}
.cta{display:block;width:fit-content;margin:18px auto 2px;padding:13px 26px;font:500 .76rem/1 var(--sans);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#fff;border:1px solid var(--blue);box-shadow:0 0 18px rgba(var(--blue-rgb),.45),inset 0 0 14px rgba(var(--blue-rgb),.18);transition:all .35s}
.cta:hover{background:var(--blue);box-shadow:0 0 26px rgba(var(--blue-rgb),.8)}
.empty{color:var(--mu);font-size:.86rem;line-height:1.6}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
@media (max-width:1080px){body{overflow:auto}main{position:relative;height:74vh}.center{position:absolute;left:0;right:0;height:74vh;bottom:auto}
 #left,#right{position:static;width:100%;transform:none;background:#000}#right{display:block}#right .scroll{max-height:60vh}#loader{top:calc(37vh + 110px)}}
</style>
</head>
<body>
<main>
  <div class="globe on" id="gE"></div>
  <div class="globe" id="gB"></div>
</main>

<aside class="panel" id="left">
  <div class="brand"><img src="lazurus.png" alt="Lazarus-5" onerror="this.remove()"><span>Planetaria</span></div>
  <div class="scroll">
    <h2>Mission target</h2>
    <div class="pick">
      <button data-body="moon" aria-pressed="true">Moon</button>
      <button data-body="mars" aria-pressed="false">Mars</button>
    </div>
    <h2 style="margin-bottom:14px">Mission categories</h2>
    <div id="cats"></div>
    <button id="apply" disabled>Apply</button>
  </div>
</aside>

<div class="center">
  <div class="views" role="group" aria-label="Globe">
    <button data-view="earth" aria-pressed="true">Earth analogs</button>
    <button data-view="body" aria-pressed="false" id="vBody">Moon surface</button>
  </div>
  <div id="site" aria-live="polite">
    <div class="cap"><b id="siteName"></b><span id="siteCoord"></span></div>
    <figure><canvas id="siteCv" width="960" height="600"></canvas><div class="box" id="siteBox"></div></figure>
    <div class="cap"><span id="siteScale"></span><span id="siteSrc"></span></div>
  </div>
  <div id="legend"></div>
  <div id="zone"></div>
  <button id="back">Return to orbit</button>
</div>

<aside class="panel" id="right">
  <section><h2 id="count">Best Earth analogs</h2><div class="scroll" id="top"></div></section>
  <section><h2 id="matchTitle">Analog match</h2><div class="scroll" id="report"></div></section>
</aside>

<script src="data.js"></script>

const BODY={
 moon:{name:'Moon',the:'the Moon',g:1.62,km:30.3,iceLat:80,z:4,hs:10,src:'NASA Moon Trek · LRO camera mosaic',tile:(z,r,c)=>`https://trek.nasa.gov/tiles/Moon/EQ/LRO_WAC_Mosaic_Global_303ppd_v02/1.0.0/default/default028mm/${z}/${r}/${c}.jpg`,tint:[150,150,155],atm:'#9fb4d8',

const reveal=tok=>{if(tok===siteTok){$('site').classList.add('show');document.body.classList.add('site')}};
function frame(la,lo,hs,step,name,src,km){const ws=Math.min(90,hs*1.6/Math.max(.045,Math.cos(la*RAD)));let s=la-hs,n=la+hs;if(s<-90){n+=-90-s;s=-90}if(n>90){s-=n-90;n=90}const w=lo-ws,e=lo+ws;
 $('siteBox').style.cssText=`left:${(lo-step/2-w)/(e-w)*100}%;width:${step/(e-w)*100}%;top:${(n-la-step/2)/(n-s)*100}%;height:${step/(n-s)*100}%`;
 $('siteName').textContent=name;$('siteCoord').textContent=coord(la,lo);$('siteScale').textContent=`${fmt(2*ws*km*Math.cos(la*RAD))} km across · cell ${fmt(step*km)} km`;$('siteSrc').textContent=src;
 SCX.fillStyle='#000';SCX.fillRect(0,0,960,600);return{w,s,e,n}}
function openSite(i){const f=frame(LA[i],LO[i],2.5,ES,place(i),'NASA GIBS · Blue Marble',111.2),tok=siteTok,im=new Image();
 im.onload=()=>{if(tok!==siteTok)return;SCX.drawImage(im,0,0,960,600);reveal(tok)};
 im.src=`https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry&STYLES=&FORMAT=image/jpeg&SRS=EPSG:4326&BBOX=${f.w},${f.s},${f.e},${f.n}&WIDTH=960&HEIGHT=600`}
function openBody(j){const cfg=BODY[S.body],b=D[S.body],f=frame(b.lat[j],b.lon[j],cfg.hs,b.step,mark(b,cfg,j),cfg.src,cfg.km),tok=siteTok,T=180/2**cfg.z,nc=2**(cfg.z+1),nr=2**cfg.z,sx=960/(f.e-f.w),sy=600/(f.n-f.s);let first=true;
 for(let r=Math.max(0,Math.floor((90-f.n)/T));r<=Math.min(nr-1,Math.floor((90-f.s-1e-6)/T));r++)for(let c=Math.floor((f.w+180)/T);c<=Math.floor((f.e+180-1e-6)/T);c++){const im=new Image();
  im.onload=()=>{if(tok!==siteTok)return;SCX.drawImage(im,(-180+c*T-f.w)*sx,(f.n-(90-r*T))*sy,T*sx+.5,T*sy+.5);if(first){first=false;setTimeout(()=>reveal(tok),450)}};im.src=cfg.tile(cfg.z,r,((c%nc)+nc)%nc)}}
function fly(i){GE.controls().autoRotate=false;closeSite();S.zoomed=true;$('back').classList.add('show');const tok=siteTok;
 GE.pointOfView({lat:LA[i],lng:LO[i],altitude:.8},REDUCE?0:2300);setTimeout(()=>{if(tok===siteTok&&S.zoomed&&S.view==='earth')openSite(i)},REDUCE?0:1900)}
function flyBody(j){const b=D[S.body];GB.controls().autoRotate=false;closeSite();S.zoomedB=true;$('back').classList.add('show');const tok=siteTok;
 GB.pointOfView({lat:b.lat[j],lng:b.lon[j],altitude:.8},REDUCE?0:2300);setTimeout(()=>{if(tok===siteTok&&S.zoomedB&&S.view==='body')openBody(j)},REDUCE?0:1900)}
function orbit(){closeSite();$('back').classList.remove('show');if(S.view==='earth'){S.zoomed=false;GE.pointOfView({altitude:ALT},REDUCE?0:1700)}else{S.zoomedB=false;GB.pointOfView({altitude:ALT},REDUCE?0:1700)}}
function reset(){closeSite();$('back').classList.remove('show');if(S.zoomed){S.zoomed=false;GE.pointOfView({altitude:ALT},REDUCE?0:1700)}if(S.zoomedB){S.zoomedB=false;GB.pointOfView({altitude:ALT},REDUCE?0:1700)}}
function select(k){S.sel=k;S.inspect=null;if(S.view!=='earth')setView('earth');else render();fly(top[k])}
function setView(v){S.view=v;document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));$('gE').classList.toggle('on',v==='earth');$('gB').classList.toggle('on',v==='body');
 closeSite();$('back').classList.toggle('show',v==='body'?S.zoomedB:S.zoomed);
 if(v==='body'){GE.pauseAnimation();GB.resumeAnimation();tiles(S.body)}else{GB.pauseAnimation();GE.resumeAnimation()}fit();render()}
document.querySelectorAll('#left input').forEach(e=>e.addEventListener('input',()=>{labels();$('apply').disabled=false}));
$('apply').onclick=()=>{$('apply').disabled=true;S.sel=null;S.inspect=null;reset();compute()};
document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{if(S.body===b.dataset.body)return;S.body=b.dataset.body;S.sel=null;S.inspect=null;GB.atmosphereColor(BODY[S.body].atm);if(S.view==='body')tiles(S.body);reset();compute()});
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('top').addEventListener('click',e=>{const b=e.target.closest('.hit');if(b)select(+b.dataset.k)});
$('back').onclick=orbit;
GE.onGlobeClick(({lat,lng})=>{const i=CELL[Math.floor((90-lat)/ES)*ENX+Math.floor((lng+180)/ES)];if(i>=0){closeSite();S.inspect=i;render()}});

fit();compute();
let booted=false;
function expand(){document.body.classList.add('ready');const c=GE.controls();
 if(REDUCE){S.alpha=1;compose();c.maxDistance=520;S.live=true;pins();return}
 const t0=performance.now(),dur=2800,s0=1/(1+ALT0),s1=1/(1+ALT);
 (function step(now){const u=Math.min(1,(now-t0)/dur),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  GE.pointOfView({altitude:1/(s0+(s1-s0)*e)-1});const a=Math.max(0,Math.min(1,(u-.5)/.45));if(a!==S.alpha){S.alpha=a;compose()}
  if(u<1)requestAnimationFrame(step);else{S.alpha=1;compose();c.maxDistance=520;S.live=true;pins()}})(t0)}
function boot(){if(booted)return;booted=true;compose();document.body.classList.add('lit');setTimeout(expand,REDUCE?0:1700)}
(()=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const x=baseE.getContext('2d');x.drawImage(im,0,0,TW,TH);x.fillStyle='rgba(0,0,0,.3)';x.fillRect(0,0,TW,TH);compose();setTimeout(boot,250)};im.onerror=boot;
 im.src='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry&STYLES=&FORMAT=image/jpeg&SRS=EPSG:4326&BBOX=-180,-90,180,90&WIDTH=2048&HEIGHT=1024';setTimeout(boot,4500)})();
}
</script>
</body>
